<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside a SATA hard disk drive</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--ink:#e9ebee;--muted:#8b939c;--line:#31363d;--blue:#6e9bd6;--orange:#ff7a2f;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:var(--ink)}.wrap{max-width:1120px;margin:auto;padding:28px 20px 80px}.mast{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:20px}.mast h1{font-size:clamp(24px,4vw,40px);line-height:1;margin:0}.mast p{color:var(--muted);max-width:620px;margin:10px 0 0;line-height:1.5}.spec{font:12px monospace;color:var(--muted);white-space:nowrap}.spec b{display:block;color:var(--ink);font:700 16px Arial}.layout{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:48px;margin-top:36px;align-items:start}.player{position:sticky;top:20px}.stage{position:relative;aspect-ratio:9/16;background:radial-gradient(circle at 50% 35%,#29313b,#08090b 66%);overflow:hidden;box-shadow:0 18px 48px #000;border:1px solid #272c32}.stage svg{width:100%;height:100%;display:block}.scene{display:none}.scene.on{display:block}.chrome{position:absolute;inset:0;pointer-events:none;z-index:2}.eyebrow,.hud{position:absolute;left:7%;right:7%;font:11px monospace;color:var(--muted);display:flex;justify-content:space-between}.eyebrow{top:5%}.hud{bottom:6%}.hud b{color:var(--ink)}.title{position:absolute;left:7%;right:10%;top:11%;font-size:clamp(20px,5cqw,36px);font-weight:800;line-height:1.05}.caption{position:absolute;left:7%;right:9%;bottom:12%;border-left:2px solid var(--ink);padding-left:12px;font-size:clamp(12px,3.5cqw,22px);line-height:1.35;background:linear-gradient(90deg,#08090bdd,transparent);padding-block:6px}.caption em{color:var(--blue);font-style:normal}.caption strong{color:var(--orange)}.controls{display:flex;gap:10px;align-items:center;margin-top:12px}button{border:1px solid var(--line);background:#111317;color:var(--ink);padding:8px 11px;cursor:pointer}button:hover{border-color:var(--blue)}.scrub{height:24px;flex:1;position:relative;cursor:pointer}.track,.fill{position:absolute;top:10px;height:3px;left:0;right:0}.track{background:var(--line)}.fill{right:auto;background:var(--ink)}.time{font:12px monospace;color:var(--muted);white-space:nowrap}.hint{font-size:12px;line-height:1.5;color:var(--muted)}.doc{border-top:1px solid var(--line)}.doc h2{margin:0;padding-top:0;font-size:24px}.shot{border-bottom:1px solid var(--line);padding:20px 0}.shot small{font:12px monospace;color:var(--blue)}.shot h3{margin:7px 0;font-size:18px}.shot p{color:#c5cad0;line-height:1.55;margin:0}.clean{position:fixed;inset:0;background:#000;z-index:5;display:flex;align-items:center;justify-content:center}.clean .stage{height:100vh;width:min(100vw,56.25vh);border:0}.exit{display:none;position:fixed;right:16px;top:16px;z-index:8}.clean~.exit{display:block}@media(max-width:820px){.layout{grid-template-columns:1fr;gap:32px}.player{position:static}.stage{max-width:440px;margin:auto}.mast{display:block}.spec{margin-top:14px}.doc{max-width:640px;margin:auto}}
</style>
</head>
<body>
<div class="wrap" id="page"><header class="mast"><div><h1>Inside a SATA hard disk drive</h1><p>Mechanics, magnetics, and thermodynamics inside a modern 3.5-inch drive.</p></div><div class="spec"><b>3:00</b>runtime<br><b>9:16</b>vertical explainer</div></header><main class="layout"><section class="player"><div class="stage" id="stage"><div class="chrome"><div class="eyebrow"><span id="count">01 / 08</span><span id="name">Cold open</span></div><div class="title" id="title"></div><div class="caption" id="caption"></div><div class="hud" id="hud"></div></div><div id="scenes"></div></div><div class="controls"><button id="play">Pause</button><div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Timeline"><div class="track"></div><div class="fill" id="fill"></div></div><div class="time" id="time">0:00 / 3:00</div></div><div class="controls"><button id="clean">Clean view</button><button id="restart">Restart</button></div><p class="hint">Scrub with the bar or arrow keys. Clean view removes the page chrome for recording.</p></section><section class="doc"><h2>Eight sequences</h2><div id="board"></div></section></main></div><button class="exit" id="exit">Exit clean view</button>
<script>
const D=180, scenes=[
 ['Cold open',16,'Inside a SATA<br>hard disk drive','A platter of aluminium-magnesium alloy turns at <strong>7,200 rpm</strong>. The sensor rides above it without touching.','spindle <b>7,200</b> rpm · rim <b>35.8 m/s</b>'],
 ['Component anatomy',26,'Seven parts,<br>one air-tight box','Platters, actuator, spindle, filters, and controller share one carefully sealed casting.','3 platters · 6 heads · 1 actuator'],
 ['The air bearing',24,'It does not hover.<br>It flies.','The moving platter creates a pressure wedge. The head settles about <em>15 nm</em> above the surface.','fly height <b>15 nm</b> · air mean path <b>66 nm</b>'],
 ['Voice coil motor',22,'Positioning is a<br>Lorentz-force problem','Current through a coil in a magnetic field moves every head together.','B <b>0.6 T</b> · I <b>1 A</b> · F <b>0.3 N</b>'],
 ['Writing bits',30,'A bit is not a pole.<br>A bit is a change.','A write head flips the magnetisation of nanoscale cobalt-alloy grains.','grain <b>8 nm</b> · bit cell <b>50 x 13 nm</b>'],
 ['Reading bits',20,'Reading is<br>quantum mechanics','A tunnelling magnetoresistive sensor turns the field from a bit into a resistance change.','parallel -> low R · antiparallel -> high R'],
 ['Pushing density',28,'Four ways past<br>the same wall','Perpendicular, shingled, and heat-assisted recording keep density moving forward.','thermal limit · <b>Ku V / kB T >= 60</b>'],
 ['Close',14,'','Thirty-six metres a second. Fifteen nanometres apart. Years without touching.','MExp · engineering, explained']
];
let t=0,playing=true,last=0,current=-1;
const $=id=>document.getElementById(id), clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
let acc=0;scenes.forEach(s=>{s.t0=acc;s.t1=acc+s[1];acc=s.t1});
function svgScene(i){return `<svg viewBox="0 0 540 960" aria-label="${scenes[i][0]}"><defs><radialGradient id="g${i}"><stop stop-color="#56616d"/><stop offset="1" stop-color="#101318"/></radialGradient></defs><g id="art${i}"></g></svg>`}
scenes.forEach((s,i)=>{const el=document.createElement('div');el.className='scene';el.innerHTML=svgScene(i);$('scenes').appendChild(el);const row=document.createElement('article');row.className='shot';row.innerHTML=`<small>${String(i+1).padStart(2,'0')} · ${fmt(s[1])}</small><h3>${s[0]}</h3><p>${s[3]}</p>`;$('board').appendChild(row)});
function drawArt(i,lt){const g=$('art'+i);g.innerHTML='';const cx=270,cy=420;if(i===0||i===1||i===7){for(let n=0;n<(i===1?3:1);n++){const y=cy+n*34;g.insertAdjacentHTML('beforeend',`<ellipse cx="${cx}" cy="${y}" rx="190" ry="72" fill="url(#g${i})" stroke="#6e9bd655"/><circle cx="${cx}" cy="${y}" r="28" fill="#08090b" stroke="#e9ebee66"/>`)}g.insertAdjacentHTML('beforeend',`<path d="M470 680 L320 450" stroke="#e9ebee" stroke-width="13"/><circle cx="320" cy="450" r="6" fill="#6e9bd6"/>`)}else if(i===2){g.insertAdjacentHTML('beforeend',`<rect y="500" width="540" height="80" fill="#252b32"/><path d="M80 430 L390 430 L370 480 L100 480Z" fill="#56616d" stroke="#e9ebee"/><path d="M40 460 Q180 ${450-Math.sin(lt)*12} 500 440" fill="none" stroke="#6e9bd6" stroke-dasharray="14 18" stroke-width="3"/><text x="76" y="620" fill="#ff7a2f" font-family="monospace" font-size="22">15 nm</text>`)}else if(i===3){g.insertAdjacentHTML('beforeend',`<circle cx="360" cy="430" r="125" fill="#20262d" stroke="#e9ebee66"/><path d="M360 330 A100 100 0 0 1 360 530" fill="none" stroke="#6e9bd6" stroke-width="9" stroke-dasharray="12 12"/><path d="M480 430 l-70 -15 v30z" fill="#ff7a2f"/><text x="40" y="700" fill="#e9ebee" font-family="monospace" font-size="22">F = B * I * L</text>`)}else if(i===4){for(let n=0;n<28;n++){const x=40+n*17;const up=n%3?1:-1;g.insertAdjacentHTML('beforeend',`<rect x="${x}" y="410" width="14" height="70" fill="#303944"/><path d="M${x+7} 465 V${up>0?420:460}" stroke="${up>0?'#6e9bd6':'#ff7a2f'}" stroke-width="3"/>`)}g.insertAdjacentHTML('beforeend',`<rect x="${80+((lt*32)%360)}" y="280" width="50" height="100" fill="#e9ebee"/><path d="M${105+((lt*32)%360)} 380 V410" stroke="#6e9bd6" stroke-width="3"/>`)}else if(i===5){g.insertAdjacentHTML('beforeend',`<rect x="145" y="300" width="250" height="145" fill="#303944" stroke="#e9ebee"/><rect x="145" y="355" width="250" height="18" fill="#8b939c"/><path d="M270 540 V445" stroke="#6e9bd6" stroke-width="5"/><path d="M270 540 V470" stroke="#ff7a2f" stroke-width="2" stroke-dasharray="5 9"/><text x="80" y="680" fill="#e9ebee" font-family="monospace" font-size="22">delta R / R</text>`)}else{for(let n=0;n<5;n++)g.insertAdjacentHTML('beforeend',`<rect x="65" y="330" width="370" height="52" transform="translate(0 ${n*48})" fill="${n===4?'#46586a':'#20262d'}" stroke="#6e9bd655"/>`);g.insertAdjacentHTML('beforeend',`<path d="M270 270 L270 330" stroke="#ff7a2f" stroke-width="4"/><text x="65" y="650" fill="#ff7a2f" font-family="monospace" font-size="22">450 C / &lt; 1 ns</text>`)} }
function render(){let i=scenes.findIndex(s=>t<s.t1);if(i<0)i=7;const s=scenes[i],lt=t-s.t0;if(i!==current){document.querySelectorAll('.scene').forEach((n,j)=>n.classList.toggle('on',j===i));$('count').textContent=String(i+1).padStart(2,'0')+' / 08';$('name').textContent=s[0];current=i}$('title').innerHTML=s[2];$('caption').innerHTML=s[3];$('hud').innerHTML=s[4];drawArt(i,lt);$('fill').style.width=(t/D*100)+'%';$('time').textContent=fmt(t)+' / 3:00';}
function loop(now){if(!playing)return;if(!last)last=now;t+=Math.min(.1,(now-last)/1000);last=now;if(t>=D){t=D;playing=false;$('play').textContent='Replay'}render();requestAnimationFrame(loop)}
$('play').onclick=()=>{if(t>=D)t=0;playing=!playing;$('play').textContent=playing?'Pause':'Play';last=0;if(playing)requestAnimationFrame(loop)};$('restart').onclick=()=>{t=0;playing=true;last=0;$('play').textContent='Pause';render();requestAnimationFrame(loop)};
function seek(e){const r=$('scrub').getBoundingClientRect();t=clamp((e.clientX-r.left)/r.width)*D;render()}$('scrub').onclick=seek;$('scrub').onkeydown=e=>{if(e.key==='ArrowRight')t=clamp(t+2,0,D);if(e.key==='ArrowLeft')t=clamp(t-2,0,D);render()};$('clean').onclick=()=>{$('page').classList.add('clean');$('stage').requestFullscreen?.()};$('exit').onclick=()=>{$('page').classList.remove('clean');document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('page').classList.remove('clean')});render();requestAnimationFrame(loop);
</script></body></html>
